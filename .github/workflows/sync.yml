
name: Sync Stardew MOD Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: modhub-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARGOS_PACKAGES_DIR: ${{ github.workspace }}/.translation-models

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt 'json5==0.12.1'

      - name: Sync catalog
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_GAME_ID: "669"
        run: python scripts/sync_catalog.py

      - name: Sync Nexus links from the SMAPI community catalog
        run: python scripts/sync_nexus_catalog.py

      - uses: actions/cache@v5
        with:
          path: .translation-models
          key: modhub-argos-en-zh-v1

      - name: Update deployable Chinese translations
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.7.1'
          python -m pip install 'argostranslate==1.11.0'
          python scripts/translate_catalog.py --engine argos --install-model --limit 10000
          python scripts/translate_catalog.py --catalog data/nexus.json --engine argos --install-model --limit 10000
          python -m unittest discover -s tests

      - name: Commit catalog changes
        run: |
          git add data/curseforge.json data/zh_translations.json data/nexus.json data/nexus_zh_translations.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore: sync MOD catalog and Chinese translations"
            git push
          fi
