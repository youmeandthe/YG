name: Test Chinese MOD catalog

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'data/**'
      - 'scripts/**'
      - 'static/**'
      - 'tests/**'
      - '*.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARGOS_PACKAGES_DIR: ${{ github.workspace }}/.translation-models
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/cache@v5
        with:
          path: .translation-models
          key: modhub-argos-en-zh-v1
      - name: Test API and translation cache
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests
      - name: Smoke-test the offline translation engine
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.7.1'
          python -m pip install 'argostranslate==1.11.0'
          python scripts/translate_catalog.py --engine argos --install-model \
            --cache "$RUNNER_TEMP/zh_translations.json" --limit 3
          python -c 'import json, os; from pathlib import Path; cache = json.loads((Path(os.environ["RUNNER_TEMP"]) / "zh_translations.json").read_text()); assert any(r["method"] == "argos" and r["zh_summary"] for r in cache.values())'
